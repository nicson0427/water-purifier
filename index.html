<style>
/* ============================================================
   LIGHT PINK THEME
   ============================================================ */
:root{
  --pink-bg:      #fff6f9;
  --pink-soft:    #ffe9f2;
  --pink-line:    #f9d8e6;
  --primary:      #d81b72;
  --primary-deep: #b3145c;
  --primary-soft: #ff5fa2;
  --gold:         #ffc94d;

  --ink:   #3f1b30;
  --muted: #7a5869;
  --white: #ffffff;

  --opt-red:    #e2373f;
  --opt-blue:   #2f7fd1;
  --opt-yellow: #e09800;
  --opt-green:  #2fa14a;

  --radius-lg: 26px;
  --radius-md: 16px;

  --shadow-md: 0 10px 30px -14px rgba(179,20,92,.22);
  --shadow-lg: 0 30px 70px -28px rgba(179,20,92,.42);

  --sans: "Montserrat","Helvetica Neue",Arial,sans-serif;
  --display: "Hatton","Times New Roman",Georgia,serif;
  --ease: cubic-bezier(.22,.61,.36,1);
}

/* ---------- reset ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--sans);
  color:var(--ink);
  background:var(--pink-bg);
  line-height:1.6;
  min-height:100vh;
  min-height:100dvh;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
svg{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2{margin:0;line-height:1.15;letter-spacing:-.02em}
p{margin:0}

.shell{width:100%;max-width:560px;margin-inline:auto;padding-inline:22px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{
  0%{opacity:0;transform:scale(.78) translateY(24px)}
  100%{opacity:1;transform:none}
}

/* ============================================================
   1. SPLASH
   ============================================================ */
main{flex:1;display:flex;flex-direction:column}
.splash{flex:1;display:grid;place-items:center;text-align:center;padding:56px 0 68px}
.splash-card{animation:rise .5s var(--ease) both;width:100%}
.splash h1{
  font-size:clamp(1.55rem,7.2vw,2.15rem);
  font-weight:900;color:var(--primary-deep);
  padding-inline:6px;overflow-wrap:break-word;
}
.splash h1 em{font-family:var(--display);font-style:normal;color:var(--primary)}
.splash .btn{margin-top:32px}

/* ============================================================
   STEPPER
   ============================================================ */
.stepper{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:30px 0 18px;
  font-size:10.5px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);
}
.stepper .bar{width:30px;height:2px;background:var(--pink-line);border-radius:2px;flex:none}
.stepper .bar.on{background:var(--primary)}
.stepper .cur{color:var(--primary-deep)}

/* ============================================================
   CARD
   ============================================================ */
.card{
  background:var(--white);border:1px solid var(--pink-line);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);
  padding:clamp(26px,5vw,38px);
  animation:rise .45s var(--ease) both;
}
.card-head{text-align:center;margin-bottom:26px}
.card-head h2{font-size:clamp(1.35rem,5.2vw,1.8rem);font-weight:900;color:var(--primary-deep)}

/* ---------- options ---------- */
.options{display:grid;gap:12px}
.option{
  display:flex;align-items:center;gap:14px;
  width:100%;text-align:left;cursor:pointer;
  background:var(--white);border:2px solid var(--pink-line);border-radius:var(--radius-md);
  padding:18px;
  transition:border-color .2s var(--ease),background .2s var(--ease),transform .15s var(--ease),box-shadow .2s;
}
.option:hover{border-color:var(--primary-soft);transform:translateX(3px);box-shadow:0 4px 14px rgba(216,27,114,.08)}
.option:focus-visible{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(216,27,114,.16)}
.option .dot{
  flex:none;width:15px;height:15px;border-radius:50%;
  box-shadow:0 0 0 4px rgba(216,27,114,.08);transition:transform .2s var(--ease);
}
.dot.red{background:var(--opt-red)} .dot.blue{background:var(--opt-blue)}
.dot.yellow{background:var(--opt-yellow)} .dot.green{background:var(--opt-green)}
.option .body{flex:1;min-width:0}
.option .body strong{display:block;font-size:.99rem;font-weight:700;color:var(--ink);line-height:1.35}
.option .mark{
  flex:none;display:grid;place-items:center;width:28px;height:28px;
  border-radius:50%;border:2px solid var(--pink-line);color:transparent;
  transition:.2s var(--ease);
}
.option .mark svg{width:15px;height:15px}
.option[aria-pressed="true"]{
  border-color:var(--primary);
  background:linear-gradient(180deg,#fff 0%,#fff2f7 100%);
  box-shadow:0 8px 22px -12px rgba(216,27,114,.45);
}
.option[aria-pressed="true"] .mark{background:var(--primary);border-color:var(--primary);color:#fff}
.option[aria-pressed="true"] .dot{transform:scale(1.15)}
.option.state-correct,.option.state-keep{border-color:var(--opt-green);background:#f3fbf5}
.option.state-correct .mark,.option.state-keep .mark{background:var(--opt-green);border-color:var(--opt-green);color:#fff}
.option.state-wrong{border-color:var(--opt-red);background:#fdf4f4}
.option.state-wrong .mark{background:var(--opt-red);border-color:var(--opt-red);color:#fff}
.option[disabled]{cursor:default;transform:none}

.progress-note{
  display:flex;align-items:center;gap:12px;
  margin:20px 0 18px;font-size:12px;font-weight:700;color:var(--muted);
}
.progress-track{flex:1;height:6px;border-radius:6px;background:var(--pink-line);overflow:hidden}
.progress-fill{
  display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,var(--primary-deep),var(--primary-soft));
  transition:width .4s var(--ease);
}
.err-msg{display:block;color:#c2185b;font-size:12.5px;font-weight:700;text-align:center;margin-top:12px}
.err-msg:empty{display:none}

/* ============================================================
   3. RESULT
   ============================================================ */
.result-card{text-align:center}
.result-icon{
  width:76px;height:76px;margin:0 auto 18px;border-radius:50%;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(150deg,var(--primary),var(--primary-deep));
  box-shadow:0 14px 30px -14px rgba(179,20,92,.7);
}
.result-icon svg{width:38px;height:38px}
.result-icon.partial{background:linear-gradient(150deg,var(--gold),#e09800)}
.result-card h2{font-size:clamp(1.4rem,5vw,1.8rem);font-weight:900;color:var(--primary-deep)}

.breakdown{margin-top:24px;display:grid;gap:10px;text-align:left}
.breakdown-item{
  display:flex;align-items:center;gap:12px;
  border:1px solid var(--pink-line);border-radius:14px;padding:14px 15px;background:#fff;
}
.breakdown-item .ico{
  flex:none;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900;
}
.breakdown-item .ico.yes{background:var(--opt-green)}
.breakdown-item .ico.no{background:var(--opt-red)}
.breakdown-item .txt{flex:1;min-width:0}
.breakdown-item .txt strong{display:block;font-size:.92rem;font-weight:700;color:var(--ink)}
.breakdown-item .verdict{
  font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;white-space:nowrap;
}
.verdict.yes{background:#e3f5e8;color:#14652c}
.verdict.no{background:#fce9e9;color:#a01b15}
.verdict.miss{background:#fff2d6;color:#7a5107}
.result-actions{margin-top:26px;display:grid;gap:11px}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:var(--primary-deep);color:#fff;border:none;cursor:pointer;
  font-size:14px;font-weight:800;
  padding:17px 30px;border-radius:999px;text-decoration:none;
  box-shadow:0 14px 30px -14px rgba(179,20,92,.85);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),opacity .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 20px 38px -14px rgba(179,20,92,.9)}
.btn:active{transform:translateY(0)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-lg{font-size:1.05rem;padding:20px 44px;background:var(--primary)}
.btn-block{width:100%}
.btn-ghost{background:var(--pink-soft);color:var(--primary-deep);box-shadow:none}
.btn-ghost:hover{background:#ffdcea;box-shadow:none}
:focus-visible{outline:3px solid var(--primary-soft);outline-offset:3px}

/* headings are focused programmatically for screen readers only,
   so they must never paint a focus ring */
h1[tabindex="-1"]:focus,
h1[tabindex="-1"]:focus-visible,
h2[tabindex="-1"]:focus,
h2[tabindex="-1"]:focus-visible{outline:none}

/* ============================================================
   CONFETTI
   ============================================================ */
.confetti-layer{position:fixed;inset:0;z-index:110;pointer-events:none;overflow:hidden}
.confetti-layer i{
  position:absolute;top:-18px;display:block;opacity:0;
  animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards;
}
@keyframes fall{
  0%{opacity:1;transform:translate3d(0,-20px,0) rotate(0deg)}
  100%{opacity:0;transform:translate3d(0,108vh,0) rotate(760deg)}
}

/* ============================================================
   MODAL
   ============================================================ */
.modal{
  position:fixed;inset:0;z-index:120;
  display:grid;place-items:center;padding:22px;
  background:rgba(63,27,48,.5);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  animation:fadeIn .3s var(--ease) both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{
  position:relative;width:100%;max-width:370px;
  background:var(--white);border-radius:var(--radius-lg);
  padding:38px 28px 30px;text-align:center;
  box-shadow:var(--shadow-lg);
  animation:pop .5s cubic-bezier(.2,1.35,.4,1) both;
  overflow:hidden;
}
.modal-card::before{
  content:"";position:absolute;inset:0 0 auto;height:7px;
  background:linear-gradient(90deg,var(--primary-deep),var(--primary-soft),var(--gold));
}
.modal-emoji{
  position:relative;width:92px;height:92px;margin:0 auto 20px;
  display:grid;place-items:center;font-size:44px;line-height:1;
  border-radius:50%;
  background:linear-gradient(150deg,var(--pink-soft),#fff);
  box-shadow:0 12px 28px -14px rgba(179,20,92,.6);
}
.modal-emoji::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  border:2px solid var(--primary-soft);opacity:.55;
  animation:ring 1.8s var(--ease) infinite;
}
@keyframes ring{
  0%{transform:scale(.9);opacity:.6}
  70%{transform:scale(1.25);opacity:0}
  100%{opacity:0}
}
.modal-card h2{
  font-size:1.6rem;font-weight:900;color:var(--primary-deep);
  margin-bottom:8px;
}
.modal-card h2 em{font-family:var(--display);font-style:normal;color:var(--primary)}
.modal-card p{color:var(--muted);font-size:.95rem;margin-bottom:24px}
.modal-actions{display:grid;gap:10px}

/* ============================================================
   FOOTER
   ============================================================ */
.site-footer{
  padding:24px 0 calc(26px + env(safe-area-inset-bottom));
  text-align:center;
}
.site-footer .shell{max-width:640px;display:flex;flex-direction:column;align-items:center;gap:11px}
.site-footer__brand{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  text-align:center;line-height:1.5;
}
.site-footer__brand-name{font-size:10.5px;font-weight:700;color:#7a5869;letter-spacing:.04em}
.site-footer__brand-note{font-size:10.5px;font-weight:500;color:#8a6474}
.wa-link{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--pink-line);border-radius:999px;
  padding:6px 14px 6px 7px;text-decoration:none;
  background:transparent;
  transition:background .2s var(--ease),border-color .2s var(--ease);
}
.wa-link:hover{background:var(--pink-soft);border-color:var(--primary-soft)}
.wa-link__icon{
  width:24px;height:24px;flex:none;border-radius:50%;
  background:#25d366;color:#fff;display:grid;place-items:center;
}
.wa-link__icon svg{width:14px;height:14px}
.wa-link span:last-child{
  font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.01em;
}
.wa-link em{font-style:normal;font-weight:700;color:#85616f}

/* ============================================================
   MOBILE
   ============================================================ */
.sticky-cta{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--pink-line);
  box-shadow:0 -8px 26px -18px rgba(179,20,92,.5);
}
.sticky-cta .btn{box-shadow:none}

@media (max-width:640px){
  .shell{padding-inline:18px}
  .card{padding:26px 20px;border-radius:20px}
  .btn{width:100%}
  .btn-lg{width:auto;padding:18px 40px}
  .option{padding:16px}
  .splash{padding:44px 0 56px}
}
@media (max-width:400px){ .btn-lg{width:100%} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  .confetti-layer{display:none}
}
</style>
</head>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const QUIZ = {
  requiredCount: 3,
  options: [
    { id:'bacteria', dot:'red',    label:'Bacteria and viruses',          correct:true  },
    { id:'metals',   dot:'blue',   label:'Heavy metals',                  correct:true  },
    { id:'odours',   dot:'yellow', label:'Odours and organic substances', correct:true  },
    { id:'minerals', dot:'green',  label:'Beneficial minerals',           correct:false }
  ]
};

/* ============================================================
   BRANDING — edit these two lines, no HTML needed
   Set either to '' to hide that line.
   ============================================================ */
const BRAND = {
  name: 'Nicson Works',
  note: 'Website services'
};

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const screens = { splash:$('#screen-splash'), quiz:$('#screen-quiz'), result:$('#screen-result') };
const stepEls = $$('#stepper [data-step]');
const barEls  = $$('#stepper [data-bar]');

let selected = new Set();
let locked   = false;
let lastFocus = null;

/* ---- routing ---- */
function goTo(step, focusHeading = true){
  Object.entries(screens).forEach(([k, el]) => { el.hidden = k !== step; });

  const n = { splash:0, quiz:1, result:2 }[step];
  $('#stepper').hidden = n === 0;
  stepEls.forEach(el => el.classList.toggle('cur', Number(el.dataset.step) === n));
  barEls.forEach(el => el.classList.toggle('on', Number(el.dataset.bar) < n));

  if (focusHeading){
    const h = screens[step].querySelector('h1, h2');
    h.setAttribute('tabindex', '-1');
    h.focus({ preventScroll:true });
  }

  if (step === 'quiz') syncSticky();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ---- 1. splash ---- */
$('#start-btn').addEventListener('click', startQuestion);

/* ---- 2. question ---- */
function buildOptions(){
  const box = $('#options');
  box.innerHTML = '';
  QUIZ.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option';
    btn.dataset.id = opt.id;
    btn.setAttribute('aria-pressed', 'false');
    btn.innerHTML =
      '<span class="dot ' + opt.dot + '" aria-hidden="true"></span>' +
      '<span class="body"><strong>' + opt.label + '</strong></span>' +
      '<span class="mark" aria-hidden="true">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" ' +
        'stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' +
      '</span>';
    btn.addEventListener('click', () => pick(opt.id));
    box.appendChild(btn);
  });
}

function startQuestion(){
  closeModal();
  buildOptions();
  selected = new Set();
  locked   = false;
  $('#submit-btn').disabled = true;
  $('#quiz-error').textContent = '';
  $('#progress-label').textContent = '0 of ' + QUIZ.requiredCount + ' selected';
  $('#progress-fill').style.width = '0%';
  goTo('quiz');
  setTimeout(() => $('#options .option')?.focus({ preventScroll:true }), 200);
}

function pick(id){
  if (locked) return;
  $('#quiz-error').textContent = '';

  selected.has(id) ? selected.delete(id) : selected.add(id);
  $$('#options .option').forEach(o => o.setAttribute('aria-pressed', String(selected.has(o.dataset.id))));

  const need = QUIZ.requiredCount;
  const ok   = selected.size >= need;
  $('#submit-btn').disabled = !ok;
  $('#progress-label').textContent = selected.size > need
    ? selected.size + ' selected'
    : selected.size + ' of ' + need + ' selected';
  $('#progress-fill').style.width =
    Math.min(100, (selected.size / QUIZ.options.length) * 100) + '%';

  syncSticky();
}

function syncSticky(){
  const sticky = $('#sticky-cta');
  const show = window.matchMedia('(max-width: 640px)').matches
            && !screens.quiz.hidden
            && !$('#submit-btn').disabled
            && !locked;
  if (!show){ sticky.hidden = true; sticky.innerHTML = ''; return; }
  sticky.innerHTML = $('#submit-btn').outerHTML;
  sticky.hidden = false;
  sticky.querySelector('button').addEventListener('click', submitAnswer);
}

/* ---- grading ---- */
function submitAnswer(){
  if (locked) return;
  if (selected.size < QUIZ.requiredCount){
    $('#quiz-error').textContent = 'Choose at least ' + QUIZ.requiredCount + ' options.';
    return;
  }
  locked = true;
  $('#sticky-cta').hidden = true;
  $('#sticky-cta').innerHTML = '';

  let correct = 0;
  QUIZ.options.forEach(opt => {
    const el = $('#options .option[data-id="' + opt.id + '"]');
    const picked = selected.has(opt.id);
    if (picked && opt.correct){ correct++; el.classList.add('state-correct'); }
    else if (picked && !opt.correct){ el.classList.add('state-wrong'); }
    else if (!picked && opt.correct){ el.classList.add('state-keep'); }
    el.setAttribute('aria-pressed', String(picked));
    el.disabled = true;
  });

  setTimeout(() => showResult(correct), 480);
}

/* ---- 3. result ---- */
const ICON_OK   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const ICON_PART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/></svg>';

function showResult(correct){
  const total    = QUIZ.options.filter(o => o.correct).length;
  const perfect  = correct === total;
  // never celebrate if a wrong option was ticked, even on a full score
  const pickedWrong = QUIZ.options.some(o => !o.correct && selected.has(o.id));
  const celebrate = perfect && !pickedWrong;

  $('#result-icon').innerHTML = perfect ? ICON_OK : ICON_PART;
  $('#result-icon').classList.toggle('partial', !perfect);
  $('#result-title').textContent = perfect ? 'Correct!' : 'Not quite.';

  $('#breakdown').innerHTML = QUIZ.options.map(o => {
    const picked = selected.has(o.id);
    const good   = picked && o.correct;
    const verdict = good ? 'yes' : (picked ? 'no' : (o.correct ? 'miss' : 'yes'));
    const vLabel = good ? 'Removed' : picked ? 'Kept in' : o.correct ? 'Missed' : 'Kept in';
    return '<div class="breakdown-item">' +
      '<span class="ico ' + (good ? 'yes' : 'no') + '">' + (good ? '✓' : '✕') + '</span>' +
      '<span class="txt"><strong>' + o.label + '</strong></span>' +
      '<span class="verdict ' + verdict + '">' + vLabel + '</span>' +
    '</div>';
  }).join('');

  goTo('result');
  if (celebrate) setTimeout(openModal, 420);
}

/* ============================================================
   CONGRATULATIONS MODAL
   ============================================================ */
const CONFETTI_COLORS = ['#ff5fa2','#ffc94d','#7bdff2','#c77dff','#ff8fab','#ffe066','#90e0ef','#f78fb3'];

function burstConfetti(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const layer = $('#confetti');
  layer.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 90; i++){
    const p = document.createElement('i');
    p.style.left = (Math.random() * 100) + '%';
    p.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
    p.style.width = (6 + Math.random() * 7) + 'px';
    p.style.height = (9 + Math.random() * 10) + 'px';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    p.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    frag.appendChild(p);
  }
  layer.appendChild(frag);
  setTimeout(() => { layer.innerHTML = ''; }, 4200);
}

function openModal(){
  lastFocus = document.activeElement;
  $('#modal').hidden = false;
  burstConfetti();
  $('#modal-again').focus();
}

function closeModal(){
  if ($('#modal').hidden) return;
  $('#modal').hidden = true;
  $('#confetti').innerHTML = '';
  if (lastFocus && lastFocus.focus) lastFocus.focus();
  lastFocus = null;
}

$('#modal-again').addEventListener('click', startQuestion);
$('#modal-close').addEventListener('click', closeModal);
$('#modal').addEventListener('click', (e) => { if (e.target === $('#modal')) closeModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key !== 'Tab' || $('#modal').hidden) return;
  const f = [$('#modal-again'), $('#modal-close')];
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

/* ---- actions ---- */
$('#submit-btn').addEventListener('click', submitAnswer);
$('#retry-btn').addEventListener('click', startQuestion);
$('#restart-btn').addEventListener('click', () => { closeModal(); goTo('splash'); });

let lastW = window.innerWidth;
window.addEventListener('resize', () => {
  if (window.innerWidth !== lastW){ lastW = window.innerWidth; syncSticky(); }
});

$('#options').addEventListener('keydown', (e) => {
  const dir = { ArrowDown:'n', ArrowRight:'n', ArrowUp:'p', ArrowLeft:'p' }[e.key];
  if (!dir) return;
  const items = $$('#options .option');
  const i = items.indexOf(document.activeElement);
  if (i === -1) return;
  e.preventDefault();
  items[dir === 'n' ? Math.min(i + 1, items.length - 1) : Math.max(i - 1, 0)].focus();
});

/* ---- apply branding ---- */
(function applyBrand(){
  const name = $('#brand-name'), note = $('#brand-note');
  if (name) name.textContent = BRAND.name;
  if (note) note.textContent = BRAND.note;
  const wrap = $('.site-footer__brand');
  if (wrap && !BRAND.name && !BRAND.note) wrap.hidden = true;
  if (name && !BRAND.name) name.hidden = true;
  if (note && !BRAND.note) note.hidden = true;
})();

goTo('splash', false);   // never focus anything on first paint</script>
